<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Teacher Results</title><link rel="stylesheet" href="style.css"></head>
<body>
<header class="app-header"><div class="timer">Teacher Results</div></header>
<main class="results-wrap"><div class="result-card">
<h2>Teacher Dashboard</h2>
<p id="status">Sign in with the teacher Google account to view submissions.</p>
<button id="loginBtn">Sign in with Google</button>
<button id="logoutBtn" class="hidden">Sign out</button>
<div id="results" style="margin-top:20px"></div>
</div></main>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";
import {getAuth,GoogleAuthProvider,signInWithPopup,onAuthStateChanged,signOut} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";
import {getFirestore,collection,getDocs,query,orderBy} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";
const firebaseConfig={apiKey:"AIzaSyCmKqbovKv1e72a7mUlGIi1Tu8BnMyoL_A",authDomain:"human-eye-mcq-test.firebaseapp.com",projectId:"human-eye-mcq-test",storageBucket:"human-eye-mcq-test.firebasestorage.app",messagingSenderId:"1081982023377",appId:"1:1081982023377:web:ef9b458516ffcc6a6b37f0"};
const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app);
const status=document.getElementById('status'),results=document.getElementById('results');
document.getElementById('loginBtn').onclick=async()=>{try{await signInWithPopup(auth,new GoogleAuthProvider())}catch(e){status.textContent='Sign-in failed: '+e.message}};
document.getElementById('logoutBtn').onclick=()=>signOut(auth);
onAuthStateChanged(auth,async user=>{if(!user){document.getElementById('loginBtn').classList.remove('hidden');document.getElementById('logoutBtn').classList.add('hidden');return}document.getElementById('loginBtn').classList.add('hidden');document.getElementById('logoutBtn').classList.remove('hidden');status.textContent='Signed in as '+(user.email||'teacher');try{const snap=await getDocs(query(collection(db,'submissions'),orderBy('submittedAt','desc')));if(snap.empty){results.innerHTML='<h3>No submissions yet.</h3>';return}let html='<table><tr><th>Name</th><th>Roll No.</th>';for(let i=1;i<=13;i++)html+=`<th>Q${i}</th>`;html+='<th>Submitted</th></tr>';snap.forEach(d=>{const s=d.data();html+=`<tr><td>${esc(s.name)}</td><td>${esc(s.rollNo)}</td>`;(s.answers||[]).forEach(a=>html+=`<td>${a==null?'-':String.fromCharCode(65+a)}</td>`);html+=`<td>${s.submittedAt?.toDate?s.submittedAt.toDate().toLocaleString():'-'}</td></tr>`});html+='</table>';results.innerHTML=html}catch(e){results.innerHTML='<p>Could not load results. Check Firestore rules.</p>';console.error(e)}});
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}
</script>
</body></html>
